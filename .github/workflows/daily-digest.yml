name: Daily Digest

on:
  schedule:
    # 04:37 UTC daily -> 5:37 AM CET (winter) / 6:37 AM CEST (summer) in
    # Warsaw. GitHub Actions cron is fixed UTC and does not adjust for DST,
    # so there is no single UTC value that's exactly the same local time
    # year-round.
    #
    # Why 04:37 and not the 06:00 you'd expect for an 8 AM delivery:
    # GitHub's scheduler is best-effort and queues *all* users' cron jobs
    # globally. Round times — and the top of the hour above all — are by far
    # the most heavily subscribed slots, so runs scheduled at ':00' routinely
    # sit in the queue for hours before a runner picks them up. An odd minute
    # at an off-peak hour lands in a much shorter queue.
    #
    # The remaining delay is still unpredictable (minutes to ~2h), so this is
    # deliberately scheduled *early*: worst case the digest arrives late
    # morning, best case shortly before 7 AM local. If it consistently fires
    # on time, move this later toward '37 5 * * *'.
    - cron: '37 4 * * *'
  workflow_dispatch: {}  # manual "Run workflow" button, for testing

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py
