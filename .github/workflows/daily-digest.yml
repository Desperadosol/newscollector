name: Daily Digest

on:
  schedule:
    # 06:00 UTC daily -> 7:00 AM CET (winter) / 8:00 AM CEST (summer) in
    # Warsaw. GitHub Actions cron is fixed UTC and does not adjust for DST,
    # so there is no single UTC value that's exactly 7 AM Warsaw year-round;
    # this was chosen to keep delivery in the "morning" range in both
    # seasons rather than skewing to 6 AM in winter. Also note: GitHub may
    # delay scheduled runs by a few to ~15 minutes under load — normal, and
    # fine for a non-time-critical personal digest.
    - cron: '0 6 * * *'
  workflow_dispatch: {}  # manual "Run workflow" button, for testing

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py
