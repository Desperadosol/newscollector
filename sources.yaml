# Feed configuration for the daily digest bot.
#
# Each entry under `feeds` is:
#   name:     human-readable source name (shown in the digest)
#   url:      RSS/Atom feed URL
#   topic:    free-form category key. Digest sections are grouped by whatever
#             distinct topic values exist here — add a 5th category by adding
#             a feed with a new topic string, then a display-name line in
#             digest.py's CATEGORY_DISPLAY_NAMES map.
#   keywords: optional list. If non-empty, an article is only kept if at
#             least one keyword (case-insensitive) appears in its title or
#             summary. Use this on broad, general-news feeds (e.g. BBC/Al
#             Jazeera cover everything, not just politics) to narrow them
#             down before the LLM call. Leave empty ([]) for feeds that are
#             already topic-scoped (e.g. a Google News search query, or a
#             tag-specific feed) — they don't need extra filtering.
#
# NOTE ON FEED RELIABILITY: Reuters and AP News discontinued most of their
# public RSS feeds, so this list deliberately avoids guessing at URLs like
# feeds.reuters.com/* that are likely dead. Before relying on any feed here,
# run `python check_feeds.py` to confirm it actually resolves and returns
# entries. The Google News RSS search pattern below
# (https://news.google.com/rss/search?q=<query>&hl=en-US&gl=US&ceid=US:en)
# is a reliable general-purpose fallback for any topic that doesn't have a
# good direct feed — use it if a feed below goes stale.

recency_hours: 168      # drop articles older than this (7 days). The narrow
                        # niche categories below (Belarusian immigration
                        # policy, students/young people) genuinely only get
                        # real, on-topic coverage every several days to a
                        # couple of weeks — a tighter window leaves them
                        # empty almost every day. High-volume feeds (BBC/Al
                        # Jazeera, general Poland politics/economics) are
                        # still capped by max_per_category below and sorted
                        # newest-first, so widening this doesn't change what
                        # they select — a busy feed always has 15+ articles
                        # well inside 168h anyway.
max_per_category: 15    # cap the raw pool per category before the Claude call

feeds:
  # --- World politics ---
  - name: "BBC World"
    url: "https://feeds.bbci.co.uk/news/world/rss.xml"
    topic: "world_politics"
    keywords:
      - election
      - government
      - president
      - minister
      - parliament
      - sanctions
      - diplomat
      - war
      - coup
      - summit
      - opposition
      - treaty
      - NATO
      - UN

  - name: "Al Jazeera — All News"
    url: "https://www.aljazeera.com/xml/rss/all.xml"
    topic: "world_politics"
    keywords:
      - election
      - government
      - president
      - minister
      - parliament
      - sanctions
      - diplomat
      - summit
      - opposition
      - treaty
      - NATO
      - UN

  # --- Polish politics ---
  # NOTE: "The First News" (thefirstnews.com) was tried here but its site-wide
  # TLS certificate is misconfigured (hostname mismatch) as of this writing,
  # so requests to any of its RSS paths fail SSL verification. Dropped in
  # favor of a Google News query for redundancy alongside Notes from Poland;
  # re-add it if/when their certificate is fixed (confirm with check_feeds.py
  # first).
  - name: "Notes from Poland"
    url: "https://notesfrompoland.com/feed/"
    topic: "poland_politics"
    keywords: []

  - name: "Google News — Poland politics"
    url: "https://news.google.com/rss/search?q=Poland+politics+OR+government+OR+election&hl=en-US&gl=US&ceid=US:en"
    topic: "poland_politics"
    keywords: []

  # --- Polish economics ---
  - name: "Google News — Poland economy"
    url: "https://news.google.com/rss/search?q=Poland+economy&hl=en-US&gl=US&ceid=US:en"
    topic: "poland_economics"
    keywords: []

  # --- Belarusians in Poland: policy/immigration focus ---
  # Narrowed per user request to specifically track policies affecting
  # Belarusian immigrants (visas, residency, asylum, border rules, legal
  # status) rather than all Belarus-tagged news (which included e.g. crime
  # stories unrelated to policy). The `keywords` list below does this
  # filtering — both feeds keep their broad topical scope, but only articles
  # whose title/summary mentions one of these policy/legal terms survive.
  # Even so, expect this section to be empty on most days: genuine policy
  # news for this specific group is inherently infrequent (real gaps of a
  # week or more between stories are normal, not a bug).
  - name: "Notes from Poland — Belarus tag"
    url: "https://notesfrompoland.com/tag/belarus/feed/"
    topic: "belarusians_in_poland"
    keywords: &belarus_policy_keywords
      - visa
      - residency
      - residence
      - permit
      - immigration
      - policy
      - deportation
      - legal status
      - citizenship
      - asylum
      - refugee
      - decree
      - regulation
      - ministry
      - work permit
      - travel document
      - residence card
      - border
      - migration law
      - karta polaka
      - special status

  - name: "Google News — Belarusians in Poland"
    url: "https://news.google.com/rss/search?q=Belarusians+Poland+OR+%22Belarusian+minority%22&hl=en-US&gl=US&ceid=US:en"
    topic: "belarusians_in_poland"
    keywords: *belarus_policy_keywords

  # --- Work/internship opportunities for students in Poland ---
  # Per user clarification, this category is specifically about new
  # work/internship opportunities and career perspectives for students in
  # Poland — not general "young people" news (housing, education policy,
  # etc., which was the previous, broader interpretation). The query uses
  # Google's `term (A OR B OR C)` grouping so every result is required to
  # mention Poland *and* one of the internship/graduate-job terms — a plain
  # "Poland X OR Y OR Z" query has low OR-precedence and only the first term
  # ends up scoped to Poland, which let global noise (foreign graduate
  # programs, unrelated "entry-level" sports contracts, etc.) through.
  - name: "Google News — Student work & internships in Poland"
    url: "https://news.google.com/rss/search?q=Poland+(internship+OR+%22graduate+programme%22+OR+%22graduate+program%22+OR+%22entry-level+job%22+OR+%22student+jobs%22)&hl=en-US&gl=US&ceid=US:en"
    topic: "student_opportunities"
    keywords: []

  # --- Tech companies in Poland ---
  # New category per user request: news about tech companies operating in
  # or expanding into Poland (funding rounds, new offices/tech hubs,
  # startups, IT sector trends). Same Poland-AND-(terms) grouping as above,
  # and deliberately excludes generic "funding"/"layoffs" as bare OR terms
  # since those pulled in unrelated non-tech funding stories.
  - name: "Google News — Tech companies in Poland"
    url: "https://news.google.com/rss/search?q=Poland+(%22tech+company%22+OR+%22Polish+startup%22+OR+%22tech+industry%22+OR+%22IT+sector%22+OR+%22tech+hub%22+OR+%22software+company%22)&hl=en-US&gl=US&ceid=US:en"
    topic: "tech_poland"
    keywords: []
